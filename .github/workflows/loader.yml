name: Loader

# The Rust loader in loader/: core tests and clippy on the runner, the GTK 4 /
# libadwaita app built inside the GNOME SDK the Flatpak runs on, natively on
# x86_64 and aarch64 runners, and the Android crate checked for the three ABIs.
on:
  push:
    branches-ignore: [main, master]
    paths: ['loader/**', 'tests/uibridge/**', '.github/workflows/loader.yml']
  pull_request:
    paths: ['loader/**', 'tests/uibridge/**', '.github/workflows/loader.yml']
  workflow_dispatch:
  workflow_call:

jobs:
  core:
    name: Core (tests, clippy, Android check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            loader/target
          key: loader-core-${{ hashFiles('loader/Cargo.lock') }}
          restore-keys: loader-core-
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal -c clippy
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Tests
        working-directory: loader
        run: cargo test --locked -p godnotic-loader-core --features http-ureq
      - name: Clippy
        working-directory: loader
        run: cargo clippy --locked -p godnotic-loader-core --features http-ureq --all-targets -- -D warnings
      - name: Android targets
        working-directory: loader
        run: |
          for t in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo check --locked --target "$t" -p godnotic-loader-android
          done

  gtk:
    name: GTK app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Must match runtime-version in flatpak/io.github.dixonSolutions.XonoticTouch.yml.
      XT_GNOME_VERSION: '48'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            loader/target
            ~/.local/share/flatpak
          key: loader-gtk-${{ matrix.arch }}-gnome${{ env.XT_GNOME_VERSION }}-${{ hashFiles('loader/Cargo.lock') }}
          restore-keys: loader-gtk-${{ matrix.arch }}-gnome${{ env.XT_GNOME_VERSION }}-
      - name: GNOME SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --no-related flathub "org.gnome.Sdk//$XT_GNOME_VERSION"
          rustup toolchain install stable --profile minimal -c clippy
      - name: Build and clippy
        run: bash loader/build.sh --check
      - uses: actions/upload-artifact@v4
        with:
          name: loader-bin-${{ matrix.arch }}
          path: loader/dist/
          if-no-files-found: error
