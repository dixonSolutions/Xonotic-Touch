name: Build and publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Do not cancel in-flight publishes — each run creates an immutable version.
concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FLATPAK_APP_ID: io.github.dixonSolutions.Godnotic
  FLATPAK_REMOTE_NAME: godnotic
  FLATPAK_REMOTE_URL: https://dixonSolutions.github.io/Godnotic/flatpak
  # Must match OpenStore app id exactly (createRevisionFromClick rejects mismatches).
  # Click package ids require a namespace: appname.developer
  CLICK_NAME: godnotic.dixonsolutions
  CLICK_FRAMEWORK: ubuntu-touch-24.04-1.x
  CLICK_REMOTE_URL: https://dixonSolutions.github.io/Godnotic/click

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  version:
    name: Version
    needs: [tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - name: Compute version
        id: stamp
        run: |
          VERSION="1.2.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

  loader:
    name: Loader
    uses: ./.github/workflows/loader.yml

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [version, loader]
    # Native runners only — QEMU aarch64-on-x86 was ~10× slower than x86_64.
    # ubuntu-24.04-arm is free for public repos.
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp package version
        run: bash scripts/set-package-version.sh "${{ needs.version.outputs.version }}"

      # Prebuilt by the loader job; the manifest installs the one for this arch.
      - name: Fetch the app binaries
        uses: actions/download-artifact@v4
        with:
          pattern: loader-bin-*
          merge-multiple: true
          path: loader/dist

      - name: Mark the app binaries executable
        run: chmod 755 loader/dist/godnotic-loader-*

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          # On-disk filename is exactly this path; auto-upload (disabled below)
          # would also append -${arch} to the *artifact name* only.
          bundle: Godnotic-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.dixonSolutions.Godnotic.yml
          arch: ${{ matrix.arch }}
          keep-build-dirs: true
          # Manual upload uses a stable name (flatpak-${arch}). Auto-upload
          # creates a second artifact that breaks unfiltered download-artifact.
          upload-artifact: false
          # The action only falls back to caches whose key starts with
          # "flatpak-builder-<arch>", and never re-saves an exact hit. A key
          # per commit under that prefix means every run restores the newest
          # ccache and saves its own.
          cache-key: flatpak-builder-${{ matrix.arch }}-xonotic-v2-${{ github.sha }}
          restore-cache: true

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: Godnotic-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  click:
    name: Click (${{ matrix.arch }})
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Clickable compiles inside its container; ccache lives in the
      # workspace so it survives between runs. Per-commit key with a prefix
      # fallback, like the Android and Flatpak jobs.
      - name: Cache ccache (click)
        uses: actions/cache@v4
        with:
          path: build/ccache-click-${{ matrix.arch }}
          key: xonotic-click-ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            xonotic-click-ccache-${{ matrix.arch }}-

      - name: Build Click package
        uses: tuxecure/clickable@v2
        with:
          image: clickable/ci-ut24.04-1.x-${{ matrix.arch }}
          run: |
            printf '%s\n' "${{ needs.version.outputs.version }}" > click/.ci-version
            printf '%s\n' "${{ env.CLICK_NAME }}" > click/.ci-name
            printf '%s\n' "${{ env.CLICK_FRAMEWORK }}" > click/.ci-framework
            clickable build --arch ${{ matrix.arch }} --skip-review --verbose

      - name: Collect Click artifact
        run: |
          mkdir -p click-out
          mapfile -t clicks < <(find . -name '*.click' -type f | head -20)
          if [ "${#clicks[@]}" -eq 0 ]; then
            echo "No .click artifact produced" >&2
            find . -maxdepth 4 -type d -name build -o -name '*.click' | head -50 >&2 || true
            exit 1
          fi
          cp -v "${clicks[@]}" click-out/
          ls -lah click-out/

      - name: Upload Click package
        uses: actions/upload-artifact@v4
        with:
          name: click-${{ matrix.arch }}
          path: click-out/*.click
          if-no-files-found: error

  android:
    name: Android
    needs: [version]
    # Same job as the standalone Android workflow; that one skips main so the
    # APKs are not built twice for a release commit.
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      version_code: ${{ github.run_number }}

  publish-pages:
    name: Publish Pages (Flatpak + Click remotes)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [version, flatpak, click]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history and tags: changelog.txt is built from the commits between
      # release tags (scripts/release-changelog.sh).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{flatpak,click}-*'
          merge-multiple: false

      - name: Build Flatpak OSTree + Click download remote
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          FLATPAK_REMOTE_URL: ${{ env.FLATPAK_REMOTE_URL }}
          CLICK_REMOTE_URL: ${{ env.CLICK_REMOTE_URL }}
          CLICK_NAME: ${{ env.CLICK_NAME }}
          PRUNE_DEPTH: '40'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak ostree
          chmod +x scripts/publish-flatpak-remote.sh scripts/publish-click-remote.sh
          mkdir -p site
          X86_BUNDLE="$(find artifacts/flatpak-x86_64 -name '*.flatpak' | head -1)"
          A64_BUNDLE="$(find artifacts/flatpak-aarch64 -name '*.flatpak' | head -1)"
          ARM64_CLICK="$(find artifacts/click-arm64 -name '*.click' | head -1)"
          ARMHF_CLICK="$(find artifacts/click-armhf -name '*.click' | head -1)"
          test -n "$X86_BUNDLE" || { echo "Missing x86_64 flatpak" >&2; exit 1; }
          test -n "$A64_BUNDLE" || { echo "Missing aarch64 flatpak" >&2; exit 1; }
          test -n "$ARM64_CLICK" || { echo "Missing arm64 click" >&2; exit 1; }
          test -n "$ARMHF_CLICK" || { echo "Missing armhf click" >&2; exit 1; }
          bash scripts/publish-flatpak-remote.sh \
            --x86 "$X86_BUNDLE" \
            --aarch64 "$A64_BUNDLE" \
            --version "$PACKAGE_VERSION"
          bash scripts/publish-click-remote.sh \
            --arm64 "$ARM64_CLICK" \
            --armhf "$ARMHF_CLICK" \
            --version "$PACKAGE_VERSION"
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Godnotic: touch FPS for Android, Ubuntu Touch and Linux</title>
          <meta name="description" content="Godnotic is the arena shooter Xonotic with touch controls, for Android, Ubuntu Touch, and any Linux phone, tablet or touchscreen PC via Flatpak.">
          </head>
          <body>
          <h1>Godnotic</h1>
          <p>The arena shooter <a href="https://xonotic.org">Xonotic</a> with two-thumb touch controls, for
          <strong>Android</strong>, <strong>Ubuntu Touch</strong>, and <strong>any Linux phone, tablet or touchscreen PC</strong> via Flatpak.
          Packages are about 60 MB; maps, textures and music download on first launch.</p>
          <ul>
            <li>Android: <a href="https://github.com/dixonSolutions/Godnotic/releases/latest">APK from GitHub Releases</a> (arm64-v8a, armeabi-v7a, x86_64)</li>
            <li>Linux: <a href="flatpak/">Flatpak remote</a> (x86_64 + aarch64; postmarketOS, Mobian, Fedora, Ubuntu and other distros)</li>
            <li>Ubuntu Touch: <a href="https://open-store.io/app/godnotic.dixonsolutions">OpenStore</a>, or <a href="click/">.click downloads</a> (arm64 + armhf)</li>
            <li><a href="https://github.com/dixonSolutions/Godnotic">Source code and docs on GitHub</a></li>
          </ul>
          <p>Build ${PACKAGE_VERSION} &middot; <a href="changelog.txt">What changed</a></p>
          </body></html>
          EOF
          # What the in-app Updates screen shows under "What's new": the
          # menu fetches this plain-text file on every platform.
          bash scripts/release-changelog.sh text "$PACKAGE_VERSION" "$GITHUB_SHA" > site/changelog.txt
          wc -c site/changelog.txt

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub can take over 10 minutes (the default) to sync the ~150 MB site
          # of Flatpak and Click remotes; it timed out on two releases in a row.
          timeout: 1800000

  release:
    name: GitHub Release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [version, flatpak, click, android]
    runs-on: ubuntu-latest
    # Explicit write scope for tag + release creation (repo Actions default
    # must also allow write: Settings → Actions → General → Workflow permissions).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '{flatpak,click,android}-*'
          merge-multiple: false

      - name: Prepare release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release/upload
          cp release/flatpak-x86_64/*.flatpak release/upload/
          cp release/flatpak-aarch64/*.flatpak release/upload/
          cp release/click-arm64/*.click release/upload/
          cp release/click-armhf/*.click release/upload/
          cp release/android-arm64-v8a/*.apk release/upload/
          cp release/android-armeabi-v7a/*.apk release/upload/
          cp release/android-x86_64/*.apk release/upload/
          ls -la release/upload/
          {
            echo "## Godnotic ${VERSION}"
            echo
            echo "Immutable release — previous tags are kept."
            echo
            bash scripts/release-changelog.sh markdown "$VERSION" "$GITHUB_SHA"
            echo
            echo "### Flatpak (Linux)"
            echo '```bash'
            echo "flatpak remote-add --user --if-not-exists godnotic \\"
            echo "  https://dixonSolutions.github.io/Godnotic/flatpak"
            echo "flatpak install --user godnotic io.github.dixonSolutions.Godnotic"
            echo '```'
            echo
            echo "### Ubuntu Touch (.click)"
            echo
            echo '<a href="https://open-store.io/app/godnotic.dixonsolutions"><img src="https://open-store.io/badges/en_US.svg" alt="OpenStore" width="200" /></a>'
            echo
            echo "OpenStore: https://open-store.io/app/godnotic.dixonsolutions"
            echo
            echo "Stable sideload downloads (always latest):"
            echo "- https://dixonSolutions.github.io/Godnotic/click/latest-arm64.click"
            echo "- https://dixonSolutions.github.io/Godnotic/click/latest-armhf.click"
            echo
            echo '```bash'
            echo "wget https://dixonSolutions.github.io/Godnotic/click/latest-arm64.click"
            echo "pkcon install-local --allow-untrusted latest-arm64.click"
            echo '```'
            echo
            echo "### Android (.apk)"
            echo
            echo "Recommended — the live APKs update themselves in the game through AndySU (signed updates, applied live, rolled back if a new version does not start):"
            echo
            echo "- \`Godnotic-live-${VERSION}-arm64.apk\` (anything from the last decade)"
            echo "- \`Godnotic-live-${VERSION}-arm32.apk\` (older phones)"
            echo "- \`Godnotic-live-${VERSION}-x64.apk\` (Chromebooks, Waydroid, emulators)"
            echo
            echo "Plain APKs (no AndySU; the game offers each new version as an APK to install):"
            echo
            echo "- \`Godnotic-${VERSION}-arm64-v8a.apk\`"
            echo "- \`Godnotic-${VERSION}-armeabi-v7a.apk\`"
            echo "- \`Godnotic-${VERSION}-x86_64.apk\`"
            echo
            echo "First launch downloads about 1 GB of maps, textures and music."
            echo
            echo "Offline Flatpak + Click bundles are attached below."
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
          } > release/notes.md

      # The Actions token cannot create a release whose target is no longer the
      # branch head (a push that lands while this run is still building makes
      # it so, and the API answers 403 "Resource not accessible by
      # integration"). Pushing the tag ourselves works for any commit, and the
      # release then attaches to the existing tag with no target at all.
      - name: Tag the built commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: Godnotic ${{ needs.version.outputs.version }}
          body_path: release/notes.md
          files: release/upload/*
          fail_on_unmatched_files: true
          make_latest: true

      # The shipped app finds its update by tag shape and asset filename. Both
      # are conventions, and breaking either strands every install silently.
      - name: Verify the release can drive in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_FEED_ABIS: arm64-v8a armeabi-v7a x86_64
        run: bash scripts/android-verify-update-feed.sh

  # Upload arm64 + armhf revisions to OpenStore (requires OPENSTORE_API_KEY).
  # OpenStore is published from openstore.yml (weekly, or by hand), not on
  # every push: one revision pair per push filled the app's storage there.

  # Separate channels keep each ABI's payload and frozen host together.
  andysu-live:
    name: AndySU live (${{ matrix.abi }})
    if: github.ref == 'refs/heads/main'
    needs: [version, android, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            suffix: arm64
          - abi: armeabi-v7a
            suffix: arm32
          - abi: x86_64
            suffix: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: apk
      - name: Prepare pinned AndySU and host
        env:
          ABI: ${{ matrix.abi }}
          SUFFIX: ${{ matrix.suffix }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          # Through the API with the job's token, and retried: anonymous
          # releases/download URLs time out (504) whenever GitHub sheds
          # anonymous load, which failed every live channel of 1.2.124.
          for i in 1 2 3 4 5 6; do
            gh release download v0.1.135 --repo dixonSolutions/AndySU --dir "$RUNNER_TEMP" --clobber \
              --pattern andysu-x86_64-unknown-linux-musl --pattern andysu-host-template-0.1.135.zip && break
            test "$i" -lt 6
            sleep $((i * 15))
          done
          mv "$RUNNER_TEMP/andysu-x86_64-unknown-linux-musl" "$RUNNER_TEMP/andysu"
          mv "$RUNNER_TEMP/andysu-host-template-0.1.135.zip" "$RUNNER_TEMP/host-template.zip"
          chmod +x "$RUNNER_TEMP/andysu"
          sed "s/channel = \"live-arm64\"/channel = \"live-$SUFFIX\"/" andysu.toml > andysu-abi.toml
          "$RUNNER_TEMP/andysu" host-config --toml andysu-abi.toml --config-out "$RUNNER_TEMP/config.json" --host-out "$RUNNER_TEMP/host.json"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          shopt -s nullglob
          apks=(apk/*.apk)
          test "${#apks[@]}" -eq 1
          "$RUNNER_TEMP/andysu" split "${apks[0]}" --out split --transparent --abi "$ABI" \
            --host-template "$RUNNER_TEMP/host-template.zip" --config "$RUNNER_TEMP/config.json" \
            --keystore "$RUNNER_TEMP/release.keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-alias "$ANDROID_KEY_ALIAS"
      - name: Refuse to republish an older app release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
      # The id must equal the version built into the host, or a fresh install takes itself for an
      # update. A re-run is a no-op, and a half-finished publish resumes (AndySU 0.1.135).
      - name: Publish signed ABI channel
        uses: dixonSolutions/AndySU/actions/publish@v0.1.135
        with:
          payload: split/payload
          config: andysu-abi.toml
          signing-key: ${{ secrets.ANDYSU_SIGNING_KEY }}
          signing-cert: ${{ secrets.ANDYSU_SIGNING_CERT }}
          version: ${{ needs.version.outputs.version }}
          pack-args: --no-rename
          andysu-version: 0.1.135
      # The AndySU action creates its channel release as a pre-release, and the
      # app's updater ignores pre-releases. Users get full releases, so clear the flag.
      - name: Make the AndySU channel release a full release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: gh release edit "andysu-live-$SUFFIX-$VERSION" --prerelease=false --latest=false
      - name: Attach live APK to app release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          name="Godnotic-live-$VERSION-$SUFFIX.apk"
          cp split/host.apk "$name"
          gh release upload "$TAG" "$name" --clobber
