name: Tests

# Quick checks that need no engine build and no display. They run on every
# branch push and pull request. main runs them through build-and-publish.yml,
# which will not publish a release that fails them.
on:
  push:
    branches-ignore: [main, master]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  input-presence:
    name: Input presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse recorded /proc/bus/input/devices listings
        run: bash scripts/test-input-presence.sh

  touch-altfire:
    name: Touch ALT button
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stock-balance fallback, availability modes and fade
        run: bash scripts/test-touch-altfire.sh

  touch-vote:
    name: Touch vote prints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server vote lines read back into vote events
        run: bash scripts/test-touch-vote.sh

  touch-spectate:
    name: Touch spectator controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The spectator bar and the join refusal lock
        run: bash scripts/test-touch-spectate.sh

  touch-hudmode:
    name: Touch HUD modes, menu actions and the join swipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mode derivation, controls per mode, action list, swipe traces
        run: bash scripts/test-touch-hudmode.sh

  phone-assets:
    name: Phone pack repack tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: zstd entries, symlinks and the manifest round-trip
        run: |
          python -m pip install -q numpy
          PYTHON=python sh scripts/test-phone-assets.sh
      - name: The archive the app streams
        run: PYTHON=python sh scripts/test-phone-archive.sh

  touch-aim:
    name: Touch auto-shoot weapon logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lead, fire mode, weapon choice and detonation
        run: bash scripts/test-touch-aim.sh

  touch-hook:
    name: Touch fall rescue logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Where a fall ends, the hook's anchor, when to fire and let go
        run: bash scripts/test-touch-hook.sh

  touch-dodge:
    name: Touch auto dodge logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Damage if the player carries on, the escape chosen, walls and ledges
        run: bash scripts/test-touch-dodge.sh

  touch-ledge:
    name: Touch ledge guard logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runs off platforms held back; bridges, stairs, walls and lower floors left alone
        run: bash scripts/test-touch-ledge.sh

  lan-logic:
    name: LAN games logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Broadcast addresses, LAN ranges, the lock key, password rejects, port lists
        run: bash scripts/test-lan-logic.sh

  uibridge:
    name: UI bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema, fixtures, store property test (diffs equal snapshots), fixture player
        run: bash scripts/test-uibridge.sh

  release-changelog:
    name: Release changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ranges between tags, order and the 16 KiB cap
        run: bash scripts/test-release-changelog.sh

  andysu-release:
    name: AndySU release naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check updater selection and configuration
        run: bash scripts/test-andysu-release.sh

  host-resources:
    name: No R ids in app code (AndySU hosts keep their own resource table)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app code resolves resources by name
        run: bash scripts/test-host-resources.sh

  upstream-sync:
    name: Upstream sync tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor, merge, resolve and hooks on throwaway repositories
        run: bash scripts/test-upstream-sync.sh

  lua-mods:
    name: Lua mods (generated API, examples, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generators current, every example and doc block compiles, manifests, archive builds reproducible
        # without game data scripts/test-mods.sh runs its static checks only;
        # docs/MODDING.md, "Testing your mod", runs the match scenarios locally
        run: bash scripts/test-mods.sh

  godnotic-client:
    name: Godnotic cache, components and join guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache reuse, cancellation and repair
        run: bash scripts/test-web-cache.sh
      - name: Safe component imports
        run: bash scripts/test-components.sh
      - name: Engine and game code match their pinned component commits
        # Only main: a work branch changes the engine before its commit exists
        # in the component repository (scripts/component-push.sh runs at merge).
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for component in darkplaces data; do
            pin=$(python3 scripts/export-components.py --show-pin "$component")
            python3 scripts/export-components.py --check "$component" "$pin"
          done
      - name: Missing maps stop signon with a visible recovery console
        run: bash scripts/test-join-world.sh
