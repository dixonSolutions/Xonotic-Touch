name: Tests

# Quick checks that need no engine build and no display. They run on every
# branch push and pull request. main runs them through build-and-publish.yml,
# which will not publish a release that fails them.
on:
  push:
    branches-ignore: [main, master]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  input-presence:
    name: Input presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse recorded /proc/bus/input/devices listings
        run: bash scripts/test-input-presence.sh

  touch-altfire:
    name: Touch ALT button
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stock-balance fallback, availability modes and fade
        run: bash scripts/test-touch-altfire.sh

  touch-aim:
    name: Touch auto-shoot weapon logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lead, fire mode, weapon choice and detonation
        run: bash scripts/test-touch-aim.sh

  touch-hook:
    name: Touch fall rescue logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Where a fall ends, the hook's anchor, when to fire and let go
        run: bash scripts/test-touch-hook.sh

  release-changelog:
    name: Release changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ranges between tags, order and the 16 KiB cap
        run: bash scripts/test-release-changelog.sh

  andysu-release:
    name: AndySU release naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check updater selection and configuration
        run: bash scripts/test-andysu-release.sh

  upstream-sync:
    name: Upstream sync tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor, merge, resolve and hooks on throwaway repositories
        run: bash scripts/test-upstream-sync.sh
