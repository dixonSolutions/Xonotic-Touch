name: Slim assets

# Builds the phone pack set (docs/PHONE_ASSETS.md) from the official data and
# publishes it, as one archive, to the stable "data-slim" release:
#
#   Xonotic/data/<official pack name>.pk3   <- the phone pack, same name
#   Godnotic-data.zip                       <- that archive, stored entries
#   Godnotic-data.zip.sha256
#   phone-manifest.json, phone-sizes.md
#
# The app streams each pk3 out of the archive over HTTP ranges, so the entry
# name is the name it installs under (PackFetch). Packing is
# scripts/pack-phone-archive.py; `--profile slim` is the size/quality preset
# the app downloads.
#
# Manual only: upstream changes never publish new Godnotic data automatically.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the autobuild archive did not change
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-slim
  cancel-in-progress: false

env:
  TAG: data-slim
  ARCHIVE: Godnotic-data.zip
  SOURCE_URL: https://beta.xonotic.org/autobuild/Xonotic-latest.zip
  # the public autobuild login GameData.java and fetch-assets-posix.sh use
  SOURCE_AUTH: 'xonotic:g-23'
  ASTCENC_VERSION: 5.7.1
  ASTCENC_SHA256: f1d576f0801e7701548da78d782f4bf70dfde3673a238d1a2ac0ebd3511b2f37

jobs:
  build:
    name: Repack for phones
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Has the source changed?
        id: source
        run: |
          etag=$(curl -sfI -u "$SOURCE_AUTH" "$SOURCE_URL" | tr -d '\r' | sed -n 's/^etag: *//Ip')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"
          old=$(gh release download "$TAG" -p phone-manifest.json -O - 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("meta", {}).get("source_etag", ""))' || true)
          echo "autobuild ETag $etag, published $old"
          if [ "${{ github.event_name }}" = schedule ] && [ -n "$etag" ] && [ "$etag" = "$old" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.source.outputs.build == 'true'
        with:
          python-version: '3.14'

      - name: Tools
        if: steps.source.outputs.build == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          python -m pip install -q numpy
          curl -sfL -o astcenc.zip \
            "https://github.com/ARM-software/astc-encoder/releases/download/$ASTCENC_VERSION/astcenc-$ASTCENC_VERSION-linux-x64.zip"
          echo "$ASTCENC_SHA256  astcenc.zip" | sha256sum -c -
          unzip -q -o astcenc.zip -d "$RUNNER_TEMP/astcenc"
          echo "ASTCENC=$RUNNER_TEMP/astcenc/bin/astcenc-avx2" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Official packs
        if: steps.source.outputs.build == 'true'
        run: |
          curl -sfL --retry 3 -u "$SOURCE_AUTH" -o "$RUNNER_TEMP/src.zip" "$SOURCE_URL"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -j "$RUNNER_TEMP/src.zip" 'Xonotic/data/*.pk3' -d "$RUNNER_TEMP/src"
          rm "$RUNNER_TEMP/src.zip"
          ls -l "$RUNNER_TEMP/src"

      - name: Repack
        if: steps.source.outputs.build == 'true'
        run: |
          # nexcompat is 125 MB of Nexuiz map textures; the browser build leaves
          # it out for the same reason, and no phone map needs it.
          packs=()
          for pack in "$RUNNER_TEMP"/src/*.pk3; do
            case "$pack" in
              *nexcompat*) echo "leaving out $(basename "$pack")" ;;
              *) packs+=("$pack") ;;
            esac
          done
          python scripts/repack-phone-assets.py --profile slim -o "$RUNNER_TEMP/out" \
            --meta source_url="$SOURCE_URL" --meta source_etag="${{ steps.source.outputs.etag }}" \
            --meta built_from="$GITHUB_SHA" \
            --meta base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            "${packs[@]}"
          cat "$RUNNER_TEMP/out/phone-sizes.md" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/out"

      - name: One archive to stream
        if: steps.source.outputs.build == 'true'
        run: |
          python scripts/pack-phone-archive.py -o "$RUNNER_TEMP/out/$ARCHIVE" \
            "$RUNNER_TEMP"/out/*-phone.pk3
          (cd "$RUNNER_TEMP/out" && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          cat "$RUNNER_TEMP/out/$ARCHIVE.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.source.outputs.build == 'true'
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --title "Godnotic slim data" \
              --notes "ASTC/zstd/Opus repack of the official Xonotic data, streamed by the Godnotic app. Made by .github/workflows/phone-assets.yml; see docs/PHONE_ASSETS.md."
          fi
          # the manifest after its archive, so a reader never sees it first
          gh release upload "$TAG" "$RUNNER_TEMP/out/$ARCHIVE" "$RUNNER_TEMP/out/$ARCHIVE.sha256" \
            "$RUNNER_TEMP/out/phone-sizes.md" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/out/phone-manifest.json" --clobber
          new=$(cd "$RUNNER_TEMP/out" && ls)
          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            echo "$new" | grep -qxF "$old" || gh release delete-asset "$TAG" "$old" --yes
          done
