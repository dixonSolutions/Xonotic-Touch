// touch/profiles/battery.cfg — alias of thermal for tablets (fanless Iris)

touch_performance_profile "battery"

// cl_maxfps, not fps_max: the latter is not a cvar and was silently ignored.
cl_maxfps 30
cl_maxidlefps 15
vid_vsync 1
r_picmipworld 3
r_picmipsprites 3
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_shadows 0
r_bloom 0
r_motionblur 0
r_coronas 0
// Match thermal: low-quality particles so impacts stay visible.
cl_particles 1
cl_particles_quality 0.35
cl_decals 0
r_water 0
r_dynamic 0
gl_texturecompression 1
r_glsl_deluxemapping 0
r_glsl_offsetmapping 0
r_glsl_postprocess 0
r_drawviewmodel 0
// showfps stays off. A frame counter is a diagnostic, not a power or thermal
// setting, and here it printed over the on-screen keyboard's bottom-right key.
// Turn it on per-session with `showfps 1` when measuring.
showfps 0

touch_glass_quality 1
touch_simple_draw 0
// See thermal.cfg: vitals are not a power setting.
touch_dodge_visible 0
touch_opacity 0.90
touch_weapon_mode 2
