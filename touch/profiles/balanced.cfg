// touch/profiles/balanced.cfg — Performance only. The default on Android.
// 60 fps where the battery profiles hold 30: the same texture and portal
// savings, the frame budget spent on frames rather than effects.

touch_performance_profile "balanced"

// cl_maxfps, not fps_max: the latter is not a cvar and was silently ignored.
// vsync paces the frames to the panel. 30 fps under a 60 Hz panel's vsync
// lands frames unevenly whenever one runs long, which reads as stutter; a
// 60 cap sits on every vblank of a 60 Hz panel and every other one at 120.
cl_maxfps 60
cl_maxidlefps 30
vid_vsync 1
// Textures: gl_picmip 1 halves each side, a quarter of the memory and of the
// bandwidth per pixel. GLES2 has no compressed formats for most of the data,
// so a map's textures arrive at four bytes a texel; at full size they crowd
// a phone's shared memory and every frame pays for it. r_picmipworld and
// r_picmipsprites only say whether gl_picmip applies (they were set to 3,
// which did nothing on its own).
gl_picmip 1
r_picmipworld 1
r_picmipsprites 1
// Tile-based phone GPUs drop hidden pixels in hardware: a depth prepass only
// sends the scene through twice.
r_depthfirst 0
// Portals and warpzones render a second scene each. Xonotic's warpzone CSQC
// forces full resolution on every server; this caps it at half.
r_water_resolutionmultiplier_max 0.5
r_water_lowquality 1
r_shadows 0
r_coronas 1
r_glsl_offsetmapping 0
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_bloom 0
r_motionblur 0
gl_texturecompression 1
cl_particles 1
cl_particles_quality 0.6
cl_decals 1
