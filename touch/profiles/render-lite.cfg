// touch/profiles/render-lite.cfg — what a phone GPU and CPU cannot afford.
// Exec'd by balanced, battery and thermal, and once by the launchers on an
// install that predates it (touch_perf_version 1 -> 2). It sets no frame cap,
// texture size or resolution: those belong to the profile that execs it.
// Measured with a recorded 8-player bot match (timedemo), GPU-bound at 4K on
// the desktop test GPU; see docs/PERFORMANCE.md.

// Bump-mapped (deluxemapped) world lighting samples a normal map and a light
// direction map for every pixel of every wall. Off, the same lightmaps light
// the world without the per-pixel bumps: 100 -> 214 fps when GPU-bound.
r_glsl_deluxemapping 0
// Damage, powerup and underwater blur are each a full-screen pass on top of
// the scene, and they push the frame through an offscreen framebuffer.
hud_postprocessing 0
// Distant players switch to their simpler LOD models sooner (Xonotic: 4 for
// players, 1 for other models): fewer vertices skinned on the CPU every
// frame, and fewer for the GPU.
cl_playerdetailreduction 6
cl_modeldetailreduction 3
// Fewer triangles on curved surfaces (from the next map load).
r_subdivisions_tolerance 8
r_drawparticles_drawdistance 800
r_drawdecals_drawdistance 250
cl_damageeffect 0
// Players far enough away for their simplest LOD model animate as one body
// rather than blending upper and lower body on a skeleton built in QuakeC
// every frame.
cl_lod_skeletonblend 0
// Spent bullet casings each run QuakeC physics every frame until they settle.
cl_casings 0
