// touch/profiles/helpers.cfg — the engine's shoot helpers at their defaults.
//
// Auto-shoot and aim assist live in the engine (engine/darkplaces/touch_aim.c),
// so the CSQC's default table never resets them when a preset is applied, and
// standard.cfg stays empty on purpose. Every preset that wants them on says so
// by exec'ing this file first, then overriding what differs. Competitive turns
// them off instead, so switching back to any other preset turns them on again.
// Settings -> Mobile -> Aim / Auto-shoot / Tactics has every one of these.

cl_touch_autoshoot 1
cl_touch_autoshoot_delay 0
cl_touch_autoshoot_release 0.15
cl_touch_autoshoot_radius 1.5
cl_touch_autoshoot_weapons 0
cl_touch_autoshoot_aimonly 0
cl_touch_autoshoot_alt 1
cl_touch_autoshoot_lead 1
cl_touch_autoshoot_steer 1
cl_touch_autoshoot_safe 1
cl_touch_autoshoot_air 1
cl_touch_autoshoot_predict 1
cl_touch_autoshoot_feet 1
cl_touch_autoshoot_group 1
cl_touch_autoshoot_clear 1
cl_touch_autoshoot_volley 1
cl_touch_autoshoot_head 1
cl_touch_autoshoot_head_rifle 0
cl_touch_autoshoot_teamsafe 1
cl_touch_autoswitch 1
cl_touch_autoswitch_smart 1
cl_touch_autoswitch_combo 1
cl_touch_autoswitch_lastresort 1
cl_touch_aimassist 1
cl_touch_aimassist_friction 0.45
cl_touch_aimassist_strength 0.6
cl_touch_aimassist_maxrate 90
cl_touch_aimassist_cone 8
cl_touch_aim_mode 1
cl_touch_aimassist_track 1
cl_touch_aimassist_hysteresis 2
cl_touch_aimassist_priority 1
cl_touch_aim_range 3000
cl_touch_aim_ring 1
// the fall rescue: the grappling hook catches you when you fall off the map
cl_touch_hook_rescue 1
// auto dodge: step aside from enemy projectiles you can see coming
cl_touch_autododge 1
