// touch/profiles/thermal.cfg — Surface / fanless tablet survival mode
// Stack after a layout preset. Goal: keep the device cool enough to play.

touch_performance_profile "thermal"

// The cvar is cl_maxfps, not fps_max — the old name silently did nothing, so
// this profile was leaving a fanless tablet rendering at ~110 fps.
cl_maxfps 30
cl_maxidlefps 15
vid_vsync 1
// Textures: gl_picmip 1 halves each side, a quarter of the memory and of the
// bandwidth per pixel. GLES2 has no compressed formats for most of the data,
// so a map's textures arrive at four bytes a texel; at full size they crowd
// a phone's shared memory and every frame pays for it. r_picmipworld and
// r_picmipsprites only say whether gl_picmip applies (they were set to 3,
// which did nothing on its own).
gl_picmip 1
r_picmipworld 1
r_picmipsprites 1
// Tile-based phone GPUs drop hidden pixels in hardware: a depth prepass only
// sends the scene through twice.
r_depthfirst 0
// Portals and warpzones render a second scene each. Xonotic's warpzone CSQC
// forces full resolution on every server; this caps it at half.
r_water_resolutionmultiplier_max 0.5
r_water_lowquality 1
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_shadows 0
r_bloom 0
r_motionblur 0
r_coronas 0
// Keep low-quality particles so rocket/blaster impacts are visible (effects-low).
// Fully disabling particles made projectiles look like they fell into the void.
cl_particles 1
cl_particles_quality 0.35
cl_decals 0
r_water 0
r_dynamic 0
gl_texturecompression 1
r_glsl_deluxemapping 0
r_glsl_offsetmapping 0
r_glsl_postprocess 0
// r_drawviewmodel is deliberately NOT set here. It was 0, and since this
// profile runs on every launch nobody ever saw the arm and weapon: one model
// costs next to nothing, and it is how a player sees what they are holding.
// showfps stays off. A frame counter is a diagnostic, not a power or thermal
// setting, and here it printed over the on-screen keyboard's bottom-right key.
// Turn it on per-session with `showfps 1` when measuring.
showfps 0

// Chamfer glass stays inside the ≤34 fill budget (TOUCH_LAYOUT_SPEC §9)
touch_glass_quality 1
touch_simple_draw 0
// touch_mobile_hud is deliberately NOT set here. It used to be 0, which is how a
// thermal profile ended up deciding whether the player could see their own
// health: the touch readouts are ~12 fills, while the stock panels they replace
// cost more, so switching them off saved nothing and cost the player their
// vitals. Frame cost belongs to the render cvars above.
touch_dodge_visible 0
touch_opacity 0.90
touch_weapon_mode 2
