// touch/profiles/standard.cfg — Arena two-thumb (default)
// Layout + feel. See docs/TOUCH_LAYOUT_SPEC.md

touch_preset "standard"
touch_handedness 0

// --- Layout (raised, non-overlapping; readable Console pill) ---
touch_scale 1.0
touch_opacity 0.92
touch_move_x 0.165
touch_move_y 0.680
touch_move_size 0.250
touch_move_visible 1
touch_fire_x 0.860
touch_fire_y 0.640
touch_fire_size 0.200
touch_fire_visible 1
touch_jump_x 0.860
touch_jump_y 0.860
touch_jump_size 0.110
touch_jump_aspect 2.6
touch_jump_visible 1
touch_crouch_x 0.700
touch_crouch_y 0.860
touch_crouch_size 0.100
touch_crouch_visible 1
touch_weapon_x 0.540
touch_weapon_y 0.860
touch_weapon_size 0.100
// Replaced by tappable HUD weapons strip (hud_panel_weapons)
touch_weapon_visible 0
touch_zoom_x 0.860
touch_zoom_y 0.480
touch_zoom_size 0.100
touch_zoom_visible 0
touch_reload_x 0.720
touch_reload_y 0.480
touch_reload_size 0.100
touch_reload_visible 0
touch_dodge_x 0.165
touch_dodge_y 0.480
touch_dodge_size 0.100
touch_dodge_visible 0
touch_con_x 0.500
touch_con_y 0.050
touch_con_size 0.058
touch_con_aspect 4.2
touch_con_visible 1
touch_con_hold_ms 350
touch_con_tap_slop_px 10
touch_con_snap 0.005
touch_con_margin_px 4
touch_con_lock 0
touch_pause_x 0.300
touch_pause_y 0.050
touch_pause_size 0.058
touch_pause_aspect 2.2
touch_pause_visible 1
touch_pause_slop_px 10
touch_pause_freeze 0
touch_pause_quit_confirm_ms 3000
touch_menu_resume_bar 1

touch_glass_quality 1
touch_simple_draw 0
touch_mobile_hud 0
touch_weapon_mode 2
touch_move_zone_w 0.32
touch_look_zone_left 0.32
touch_look_zone_right 1.0
touch_edge_deadzone_px 10
touch_finger_grace_ms 120
touch_look_owns_view 1

// --- Feel ---
touch_sens_base 2.8
touch_sens_y_mult 0.85
touch_invert_y 0
touch_look_smoothing 1
touch_look_deadzone_px 4
touch_look_escape_carry 0.5
touch_look_max_deg_per_s 900
touch_stick_deadzone 0.18
touch_stick_range 1.0
touch_aim_assist 0

// --- Behavior ---
touch_fire_mode 0
touch_zoom_mode 0
touch_auto_fire 0
touch_dodge_mode 0
touch_scoreboard_gesture 0
touch_chat_mode 1

touch_hud_x 0.015
touch_hud_y 0.015
touch_hud_maxhealth 100
touch_hud_maxarmor 100
touch_ammo_x 0.015
touch_ammo_y 0.015
touch_hud_scale 0.85

// Engine look is owned by CSQC when touch_look_owns_view 1
m_pitch 0.022
m_yaw 0.022
