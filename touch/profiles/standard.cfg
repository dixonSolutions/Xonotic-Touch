// touch/profiles/standard.cfg — Arena two-thumb (default)
// Layout + feel. Sizes are millimetre-grounded on the 13" 3:2 reference panel
// (nsize = mm / 183.2); see docs/TOUCH_UX_REDESIGN.md §3 and §7.

touch_preset "standard"
touch_handedness 0

// --- Layout: one bottom baseline, empty centre third for the crosshair ---
touch_scale 1.0
touch_opacity 0.90
// MOVE and FIRE share one centre line so the bottom row reads as a row.
touch_move_x 0.170
touch_move_y 0.680
touch_move_size 0.229          // 42 mm — spans the thumb comfort arc
touch_move_visible 1
touch_fire_x 0.855
touch_fire_y 0.680
touch_fire_size 0.140          // 26 mm — hot button, also the look surface
touch_fire_visible 1
// Claw-grip second trigger: costs pixels, not fingers. Off by default.
touch_fire2_x 0.135
touch_fire2_y 0.240
touch_fire2_size 0.120
touch_fire2_visible 0
touch_jump_x 0.855
touch_jump_y 0.885
touch_jump_size 0.072          // 13 mm tall capsule
touch_jump_aspect 2.6
touch_jump_visible 1
touch_crouch_x 0.700
touch_crouch_y 0.885           // shares the HOP baseline
touch_crouch_size 0.066        // 12 mm
touch_crouch_visible 1
touch_weapon_x 0.540
touch_weapon_y 0.885
touch_weapon_size 0.066
// Replaced by tappable HUD weapons strip (hud_panel_weapons)
touch_weapon_visible 0
touch_zoom_x 0.860
touch_zoom_y 0.480
touch_zoom_size 0.066
touch_zoom_visible 0
touch_reload_x 0.720
touch_reload_y 0.480
touch_reload_size 0.066
touch_reload_visible 0
touch_dodge_x 0.165
touch_dodge_y 0.480
touch_dodge_size 0.066
touch_dodge_visible 0
// System chrome: inset from the top edge (GNOME reserves top-edge drags) and
// dimmer than the gameplay controls, because they matter less.
touch_con_x 0.500
touch_con_y 0.045
touch_con_size 0.040
touch_con_aspect 4.2
touch_con_visible 1
touch_con_hold_ms 350
touch_con_tap_slop_px 10
touch_con_snap 0.005
touch_con_margin_px 4
touch_con_lock 0
touch_kb_height 0.46
touch_kb_gap 0.008
touch_kb_opacity 0.92
touch_kb_layout 0
touch_kb_split 0
touch_kb_minkey_px 36
touch_conui_shade 0.62
touch_conui_palette_file "touch/console_palette.txt"
touch_pause_x 0.320
touch_pause_y 0.045
touch_pause_size 0.040
touch_pause_aspect 2.2
touch_pause_visible 1
touch_pause_slop_px 10
touch_pause_freeze 0
touch_pause_quit_confirm_ms 3000
touch_menu_resume_bar 0

touch_glass_quality 1
touch_simple_draw 0
touch_mobile_hud 0
touch_weapon_mode 2
touch_move_zone_w 0.32
touch_look_zone_left 0.32
touch_look_zone_right 1.0
touch_edge_deadzone_px 10
touch_finger_grace_ms 120
touch_look_owns_view 1

// --- Feel ---
touch_sens_base 2.8
touch_sens_y_mult 0.85
touch_invert_y 0
// 1 euro filter: cutoff adapts to thumb speed, so slow aim is de-jittered
// without paying latency on fast flicks (§6.6).
touch_look_filter 1
touch_look_fcmin 1.5
touch_look_beta 0.03
touch_look_smoothing 1
touch_look_deadzone_px 4
touch_look_escape_carry 0.5
touch_look_max_deg_per_s 900
touch_stick_deadzone 0.18
touch_stick_range 1.0
touch_aim_assist 0

// --- Behavior: four inputs on two thumbs (§6) ---
touch_fire_mode 0
// Sliding off FIRE keeps shooting and starts aiming — one finger, two inputs.
touch_fire_drag_look 1
// A tap in the look zone that never becomes a drag fires one shot.
touch_look_tap_fire 1
touch_look_tap_ms 200
// Bunny-hopping is a *held* key in this game, so latch it rather than parking a
// thumb on the bar. 0 hold, 1 latch, 2 auto-while-moving.
touch_hop_mode 1
touch_zoom_mode 0
touch_auto_fire 0
touch_dodge_mode 0
touch_scoreboard_gesture 0
touch_chat_mode 1

touch_hud_x 0.015
touch_hud_y 0.015
touch_hud_maxhealth 100
touch_hud_maxarmor 100
touch_ammo_x 0.015
touch_ammo_y 0.015
touch_hud_scale 0.85

// Engine look is owned by CSQC when touch_look_owns_view 1
m_pitch 0.022
m_yaw 0.022
