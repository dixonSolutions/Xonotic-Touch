// touch/profiles/standard.cfg — Arena two-thumb (default)
//
// Deliberately almost empty. The layout, feel and behaviour defaults live in
// one table in qcsrc/client/touch_init.qc (Touch_DefineCvars), and applying a
// preset resets to that table before exec'ing the profile. So a profile only
// states what makes it *different* from standard — and standard, by definition,
// differs in nothing.
//
// This file used to restate all ~100 settings. Because profiles are exec'd after
// the cvars are registered, that copy silently won every disagreement: changing
// a default in the code had no effect on a device, and the file still carried
// pre-redesign geometry long after the redesign. See
// docs/TOUCH_UX_REDESIGN.md §11.

touch_preset "standard"

// CSQC owns the view while touch_look_owns_view is 1, but the engine still needs
// sane values in case ownership is handed back mid-session.
m_pitch 0.022
m_yaw 0.022
