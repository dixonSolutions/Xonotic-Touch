// touch/profiles/quality.cfg — Performance only (plugged in / cool device)
// Higher fidelity where thermals allow

touch_performance_profile "quality"

// cl_maxfps, not fps_max: the latter is not a cvar and was silently ignored.
// 0 is uncapped; the panel is 60 Hz, so this only matters when vsync is off.
cl_maxfps 0
gl_picmip 0
// Full resolution and every lighting effect render-lite.cfg turns down.
r_viewscale_maxheight 0
r_glsl_deluxemapping 1
r_shadow_gloss 1
hud_postprocessing 1
cl_playerdetailreduction 4
cl_lod_skeletonblend 1
cl_casings 1
cl_modeldetailreduction 1
r_subdivisions_tolerance 3
r_drawparticles_drawdistance 1000
r_drawdecals_drawdistance 300
cl_damageeffect 1
r_picmipworld 1
r_picmipsprites 1
r_water_resolutionmultiplier_max 1
r_water_lowquality 0
// Realtime world lights render every light of the map with shadows, several
// scenes a frame; no phone GPU holds a frame rate with that. Dynamic lights
// (rockets, explosions) stay.
r_shadow_realtime_world 0
r_shadow_realtime_dlight 1
r_bloom 1
r_motionblur 0
gl_texturecompression 0
cl_particles 1
cl_particles_quality 1.0
cl_decals 1
