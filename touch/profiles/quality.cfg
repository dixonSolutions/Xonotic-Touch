// touch/profiles/quality.cfg — Performance only (plugged in / cool device)
// Higher fidelity where thermals allow

touch_performance_profile "quality"

// cl_maxfps, not fps_max: the latter is not a cvar and was silently ignored.
// 0 is uncapped; the panel is 60 Hz, so this only matters when vsync is off.
cl_maxfps 0
r_picmipworld 0
r_picmipsprites 0
r_shadow_realtime_world 1
r_shadow_realtime_dlight 1
r_bloom 1
r_motionblur 0
gl_texturecompression 0
cl_particles 1
cl_particles_quality 1.0
cl_decals 1
