// touch/profiles/minimal.cfg — Small screens: stick, FIRE, HOP, nothing else.
// Layers on standard.cfg. Hick's Law taken to its conclusion: on a phone the
// screen is mostly thumb, so every optional control is hidden and crouch/zoom
// move into the "more" panel (touch_minimal_more).

exec touch/profiles/standard.cfg

touch_preset "minimal"

touch_scale 1.05
touch_opacity 0.70

// Only the three controls you cannot play without stay on screen.
touch_crouch_visible 0
touch_weapon_visible 0
touch_zoom_visible 0
touch_reload_visible 0
touch_dodge_visible 0
touch_minimal_more 1

// A small screen leaves no room for a second aim surface, so fire-drag-look and
// tap-to-fire are doing the heavy lifting here.
touch_fire_drag_look 1
touch_look_tap_fire 1
touch_hop_mode 2

touch_sens_base 3.2
touch_sens_y_mult 1.0
touch_look_deadzone_px 8
touch_stick_deadzone 0.16
touch_aim_assist 1

touch_weapon_mode 1
touch_weapon_slot1 "Laser"
touch_weapon_slot2 "Shotgun"
touch_weapon_slot3 "Grenade Launcher"

sensitivity 3.2
touch_hud_scale 1.05
