// touch/profiles/casual.cfg — New players: larger targets, relaxed aim.
// Layers on standard.cfg and only states what differs, so layout fixes made
// there reach every preset.

exec touch/profiles/standard.cfg

touch_preset "casual"

// Everything grows together rather than per-widget, which keeps the bottom
// baseline and the spacing rhythm intact.
touch_scale 1.15
touch_opacity 0.75

// Heavier jitter rejection: a new player's thumb wanders, and at this skill
// level the tradeoff for a little extra latency is worth it.
touch_look_fcmin 0.8
touch_look_beta 0.015
touch_sens_base 2.4
touch_look_deadzone_px 8
touch_stick_deadzone 0.20

// A new player's aim gets more help: a stronger slowdown and pull, and a
// wider cone to catch an enemy in.
exec touch/profiles/helpers.cfg
cl_touch_aimassist_friction 0.55
cl_touch_aimassist_strength 0.75
cl_touch_aimassist_maxrate 120
cl_touch_aimassist_cone 10

// Jump without thinking about it: hold the stick, keep hopping.
touch_hop_mode 2
touch_dodge_visible 1

touch_hud_scale 1.1
