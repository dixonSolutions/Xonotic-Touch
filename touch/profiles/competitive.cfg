// touch/profiles/competitive.cfg — Experienced touch FPS players.
// Layers on standard.cfg: smaller, dimmer, faster, no assist.

exec touch/profiles/standard.cfg

touch_preset "competitive"

// Still above the 9 mm floor after scaling (26 mm FIRE × 0.92 = 24 mm).
touch_scale 0.92
touch_opacity 0.55

// Claw grip is the point of this preset: ALT (secondary fire) moves from
// beside FIRE to the top-left, under the left index finger, so the right thumb
// never has to leave the aim surface. Still contextual (2): it only shows for a
// weapon with a secondary fire that can fire.
touch_fire2_x 0.135
touch_fire2_y 0.240
touch_fire2_size 0.120
touch_fire2_visible 2

touch_sens_base 4.2
touch_sens_y_mult 1.0
// Minimal filtering — these players want the raw signal.
touch_look_filter 1
touch_look_fcmin 3.0
touch_look_beta 0.06
touch_look_deadzone_px 3
touch_stick_deadzone 0.12
// "No assist" means the engine's shoot helpers too: no auto-shoot, no
// slowdown or pull, no weapon picked for you, no hook fired to catch a fall,
// no dodge.
// Settings → Mobile can still turn them back on.
cl_touch_autoshoot 0
cl_touch_aimassist 0
cl_touch_autoswitch 0
cl_touch_autoswitch_smart 0
cl_touch_autoswitch_combo 0
cl_touch_autoswitch_lastresort 0
cl_touch_hook_rescue 0
cl_touch_autododge 0

touch_hop_mode 3
touch_dodge_mode 1
touch_crouch_visible 1
touch_weapon_mode 1
touch_weapon_slot1 "Laser"
touch_weapon_slot2 "Shotgun"
touch_weapon_slot3 "Grenade Launcher"
touch_chat_mode 0

touch_hud_scale 0.9
