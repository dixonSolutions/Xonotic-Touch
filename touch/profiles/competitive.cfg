// touch/profiles/competitive.cfg — Experienced touch FPS players.
// Layers on standard.cfg: smaller, dimmer, faster, no assist.

exec touch/profiles/standard.cfg

touch_preset "competitive"

// Still above the 9 mm floor after scaling (26 mm FIRE × 0.92 = 24 mm).
touch_scale 0.92
touch_opacity 0.55

// Claw grip is the point of this preset: a left trigger so the right thumb
// never has to leave the aim surface.
touch_fire2_visible 1

touch_sens_base 4.2
touch_sens_y_mult 1.0
// Minimal filtering — these players want the raw signal.
touch_look_filter 1
touch_look_fcmin 3.0
touch_look_beta 0.06
touch_look_deadzone_px 3
touch_stick_deadzone 0.12
touch_aim_assist 0

touch_hop_mode 1
touch_dodge_mode 1
touch_crouch_visible 1
touch_weapon_mode 1
touch_weapon_slot1 "Laser"
touch_weapon_slot2 "Shotgun"
touch_weapon_slot3 "Grenade Launcher"
touch_chat_mode 0

sensitivity 4.2
touch_hud_scale 0.9
