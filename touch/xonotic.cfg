// Xonotic Touch — touch/xonotic.cfg (tracked defaults)
// Resolution/DPI: touch/screen-calc.sh → docs/SCREEN.md
// Control presets: touch/profiles/*.cfg at launch → docs/CONTROLS.md
// Default chain: xonotic.cfg → screen.layout.cfg → touch/startup.cfg → profiles → ~/.xonotic/touch.layout.cfg

exec xonotic-common.cfg

set g_xonoticversion "Xonotic Touch"

sensitivity 3.5
m_pitch 0.022
m_yaw 0.022
vid_fullscreen 1
vid_touchscreen_mode 1
vid_touchscreen_touchonly 1
menu_mouse_absolute 1
cl_movement 1
cl_movement_maxspeed 320
cl_movement_jumpvelocity 270
cl_curl_enabled 0
// Keep Touch CSQC (sticks / Console) when joining stock servers that push their own csprogs.
cl_csqc_download 0
r_shadow_realtime_world 0
r_shadow_realtime_dlight 0
r_bloom 0
r_motionblur 0
gl_texturecompression 1
// xonotic-client.cfg sets r_texture_dds_swdecode 1, which makes DarkPlaces
// software-decode DDS textures whenever the GPU cannot sample them. Mali (and
// most mobile GL ES parts) report no GL_EXT_texture_compression_s3tc, so every
// world texture took that path and came out black -- maps loaded, collision and
// bots worked, the minimap drew, but the world itself was an unlit void.
// Back to the engine default: skip the DDS and load the original tga/jpg, which
// renders correctly. GPUs that do support S3TC still use the DDS.
r_texture_dds_swdecode 0
r_picmipworld 2
r_picmipsprites 2
r_drawviewmodel 0
// Low-quality particles so impacts/explosions remain readable on tablet defaults.
r_particles 1
cl_particles 1
cl_particles_quality 0.35
cl_decals 0
// cl_maxfps, not fps_max: DarkPlaces has no fps_max, so the old line was silently
// dropped and the tablet ran unthrottled and hot. See docs/TOUCH_UX_REDESIGN.md §12.
cl_maxfps 60
cl_maxidlefps 20
vid_vsync 1
scr_sshot_jpeg 0
con_closeontoggle 1


// healtharmor/ammo are deliberately NOT set here. Whether the stock panels or the
// touch readouts own vitals is decided by touch_mobile_hud in
// Touch_ApplyMobileHudEngineSettings(). Pinning them to 0 here is what left players
// with no health, armour or ammo at all when the touch HUD was off.
// hud_panel_weapons is not set here either, for the same reason: the touch strip
// in touch_hud.qc and the stock panel are alternatives, and which one draws is
// decided alongside vitals. The geometry below only applies to the stock panel,
// as the fallback when the touch readouts are off.
seta hud_panel_weapons_pos "0.915 0.18"
seta hud_panel_weapons_size "0.075 0.58"
seta hud_panel_weapons_aspect "0.9"
seta hud_panel_weapons_onlyowned 1
seta hud_panel_weapons_timeout 0
seta hud_panel_weapons_label 1
seta hud_panel_weapons_bg 1
seta hud_panel_weapons_bg_alpha 0.35
