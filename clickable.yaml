clickable_minimum_required: '8.0.0'
builder: custom
framework: ubuntu-touch-24.04-1.x
kill: xonotic
ignore_review_errors: true

dependencies_host:
  - build-essential
  - make
  - gcc
  - g++
  - git
  - pkg-config
  - autoconf
  - automake
  - libtool
  - zip
  - curl
  - unzip
  - file

dependencies_target:
  - libsdl2-dev
  - libjpeg-dev
  - zlib1g-dev
  - libxmp-dev
  - libgmp-dev

# Must stay a single simple command — Clickable runs this through shlex.split.
build: bash scripts/clickable-build.sh
