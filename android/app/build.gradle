apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Every knob comes from scripts/android-build.sh so the gradle file stays
// free of paths that only exist on one machine.
def depsPrefix   = project.findProperty('deps_prefix')   ?: "${rootDir}/../build/android/prefix/arm64-v8a"
def targetAbi    = project.findProperty('compile_abi')   ?: 'arm64-v8a'
def appVersion   = project.findProperty('version_name')  ?: 'dev'
def appCode      = (project.findProperty('version_code') ?: '1').toInteger()
def keystorePath = project.findProperty('keystore')      ?: ''

android {
    namespace 'io.github.dixonsolutions.godnotic'
    compileSdk 35
    ndkVersion project.findProperty('ndk_version') ?: '27.3.13750724'

    defaultConfig {
        applicationId 'io.github.dixonsolutions.godnotic'
        minSdk 21
        targetSdk 35
        versionCode appCode
        versionName appVersion
        ndk { abiFilters targetAbi }
        externalNativeBuild {
            cmake {
                arguments "-DXONOTIC_DEPS_PREFIX=${depsPrefix}",
                          "-DXONOTIC_VERSION=${appVersion}"
                // Test builds only: extra engine defines, e.g. ANDYSU_NO_HEALTHY.
                if (project.findProperty('andysu_test_defs')) {
                    arguments "-DANDYSU_TEST_DEFS=${project.findProperty('andysu_test_defs')}"
                }
                // ccache when the host has it: the NDK compiler call is
                // wrapped and the second build of a commit costs seconds.
                def ccacheBin = ['/usr/bin/ccache', '/usr/local/bin/ccache',
                                 '/opt/homebrew/bin/ccache'].find { new File(it).exists() }
                if (ccacheBin != null && System.getenv('XONOTIC_NO_CCACHE') == null) {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=${ccacheBin}"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1+'
        }
    }

    sourceSets {
        main {
            // libSDL2.so and libpng16.so are built by scripts/android-deps.sh and
            // staged per ABI; SDL's Java glue is copied out of the same tarball.
            jniLibs.srcDirs = ['src/main/jniLibs']
            // strings.xml as an asset: see HostRes. Under AndySU the assets
            // update with the code and resources.arsc does not.
            assets.srcDirs += ["$buildDir/generated/xt-strings"]
        }
    }

    if (keystorePath) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword project.getProperty('storepass')
                keyAlias project.getProperty('alias')
                keyPassword project.getProperty('storepass')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        // The engine dlopen()s libpng at runtime, which only works if the
        // library is a real file in the install's lib dir.
        jniLibs.useLegacyPackaging = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Kotlin otherwise targets the JDK that runs gradle (21 locally), and the
    // build stops on the mismatch with Java's 17.
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // The native interface's lists and grids (fe/Lists.kt): view recycling,
    // windowed data, stable ids. Its views are built in code, never inflated,
    // so no layout of it reaches the (AndySU host's) resource table.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}

// JVM unit tests of the native interface's model (src/test): the UI bridge
// fixtures of the tree when present (docs/UI_BRIDGE.md section 13).
tasks.withType(Test).configureEach {
    systemProperty 'uib.fixtures', "${rootDir}/../tests/uibridge/fixtures"
}

// HostRes reads this build's strings from the assets, never through R.string
// ids, which point into whatever table the installed (AndySU) host has.
def copyStringsAsset = tasks.register('copyStringsAsset', Copy) {
    from 'src/main/res/values/strings.xml'
    // The boot screens' banner (BootSplash), an asset for the same reason;
    // scripts/gen-branding.py writes it.
    from "${rootDir}/../branding/godnotic-banner.png"
    into "$buildDir/generated/xt-strings/xt"
}
preBuild.dependsOn copyStringsAsset

